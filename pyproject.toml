[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MaSTRspy"
version = "1.0.0"
description = "STR Analysis Tool"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Mohammad Alsuwaidi" }
]

dependencies = [
    "PySide6>=6.5",
    "pysam>=0.21",
    "matplotlib>=3.7",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0"
]

[project.scripts]
mastrspy = "main:main"


[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"MaSTR_Database" = "MaSTR_Database"
"config" = "config"
"assets" = "assets"

[tool.hatch.build.targets.sdist]
include = ["src/", "main.py", "MaSTR_Database/", "config/", "assets/", "pyproject.toml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N816"] 

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
